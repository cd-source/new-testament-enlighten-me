<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
  <title id="title">Tarjeta biblica de Juan 15:13</title>
  <desc id="desc">Ejemplo de imagen de suscripcion en espanol para Enlighten-Me.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12172a" />
      <stop offset="0.55" stop-color="#16233a" />
      <stop offset="1" stop-color="#332015" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="52%">
      <stop offset="0" stop-color="#f8d46b" stop-opacity="0.52" />
      <stop offset="0.48" stop-color="#d6a433" stop-opacity="0.16" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>
  <rect width="480" height="600" rx="34" fill="url(#bg)" />
  <rect width="480" height="600" rx="34" fill="url(#halo)" />
  <path d="M44 90c78-54 119-31 170 4 47 32 97 54 173-8" fill="none" stroke="#facc15" stroke-width="2" stroke-opacity="0.5" />
  <path d="M64 420c83 48 138 42 209-8 48-34 88-45 145-10" fill="none" stroke="#8ecae6" stroke-width="2" stroke-opacity="0.32" />
  <g filter="url(#shadow)">
    <rect x="54" y="74" width="372" height="452" rx="24" fill="#0f172a" fill-opacity="0.78" stroke="#facc15" stroke-opacity="0.42" />
  </g>
  <text x="240" y="132" text-anchor="middle" fill="#facc15" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">Juan 15:13</text>
  <line x1="166" y1="154" x2="314" y2="154" stroke="#facc15" stroke-opacity="0.45" />
  <text x="240" y="220" text-anchor="middle" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">
    <tspan x="240" dy="0">Nadie tiene mayor</tspan>
    <tspan x="240" dy="39">amor que este, que</tspan>
    <tspan x="240" dy="39">ponga alguno su vida</tspan>
    <tspan x="240" dy="39">por sus amigos.</tspan>
  </text>
  <text x="240" y="438" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">RV1909</text>
  <circle cx="240" cy="484" r="18" fill="none" stroke="#facc15" stroke-opacity="0.72" stroke-width="2" />
  <path d="M231 484l7 7 13-16" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
