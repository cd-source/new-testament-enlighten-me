<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
  <title id="title">Tarjeta biblica de Mateo 5:14</title>
  <desc id="desc">Ejemplo de imagen de suscripcion en espanol para Enlighten-Me.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827" />
      <stop offset="0.48" stop-color="#233047" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="18%" r="55%">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.64" />
      <stop offset="0.42" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="480" height="600" rx="34" fill="url(#bg)" />
  <rect width="480" height="600" rx="34" fill="url(#light)" />
  <path d="M92 455l42-54 34 36 43-68 42 70 33-31 63 47v76H92z" fill="#020617" fill-opacity="0.55" />
  <path d="M240 72v60M204 84l23 51M276 84l-23 51" stroke="#facc15" stroke-width="3" stroke-linecap="round" stroke-opacity="0.62" />
  <g filter="url(#shadow)">
    <rect x="54" y="74" width="372" height="452" rx="24" fill="#111827" fill-opacity="0.78" stroke="#facc15" stroke-opacity="0.4" />
  </g>
  <text x="240" y="132" text-anchor="middle" fill="#facc15" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">Mateo 5:14</text>
  <line x1="166" y1="154" x2="314" y2="154" stroke="#facc15" stroke-opacity="0.45" />
  <text x="240" y="214" text-anchor="middle" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">
    <tspan x="240" dy="0">Vosotros sois la luz</tspan>
    <tspan x="240" dy="38">del mundo: una ciudad</tspan>
    <tspan x="240" dy="38">asentada sobre un monte</tspan>
    <tspan x="240" dy="38">no se puede esconder.</tspan>
  </text>
  <text x="240" y="438" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">RV1909</text>
  <circle cx="240" cy="484" r="24" fill="#facc15" fill-opacity="0.18" stroke="#facc15" stroke-opacity="0.78" stroke-width="2" />
  <path d="M240 467v34M223 484h34" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
</svg>
